name: CI

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set UID/GID for Docker
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: Copy environment file
        run: cp base_files/development/.env .env

      - name: Build and start services
        run: docker compose -f docker-compose.yml --env-file .env up -d --build --wait --wait-timeout 120

      - name: Setup database
        run: docker compose -f docker-compose.yml --env-file .env exec -T app rails db:prepare

      - name: Run Brakeman security scan
        run: docker compose -f docker-compose.yml --env-file .env exec -T app bin/brakeman --no-pager

      - name: Run RuboCop linter
        run: docker compose -f docker-compose.yml --env-file .env exec -T app bin/rubocop

      - name: Run RSpec tests
        run: docker compose -f docker-compose.yml --env-file .env exec -T app bundle exec rspec

      - name: Generate Swagger documentation
        run: docker compose -f docker-compose.yml --env-file .env exec -T app bundle exec rake rswag:specs:swaggerize

      - name: Verify Swagger documentation is up to date
        run: |
          if ! git diff --quiet swagger/; then
            echo "ERROR: Swagger documentation is out of date!"
            echo "Please run 'make swagger' and commit the changes."
            git diff swagger/
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --env-file .env logs

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml --env-file .env down -v
