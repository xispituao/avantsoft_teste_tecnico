# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activerecord:
    models:
      frame: Frame
      circle: Circle
    attributes:
      frame:
        x_axis: X Position
        y_axis: Y Position
        width: Width
        height: Height
        circle_count: Circle Count
        highest_circle_position: Highest Circle Position
        lowest_circle_position: Lowest Circle Position
        leftmost_circle_position: Leftmost Circle Position
        rightmost_circle_position: Rightmost Circle Position
      circle:
        x_axis: X Position
        y_axis: Y Position
        diameter: Diameter
        frame_id: Frame ID
    errors:
      models:
        frame:
          attributes:
            base:
              no_overlap: "Frame cannot overlap or touch another frame"
        circle:
          attributes:
            base:
              fits_in_frame: "Circle must fit completely inside the frame"
              no_overlap: "Circle cannot overlap or touch another circle"

  errors:
    messages:
      missing_parameters: "Missing required parameters: %{params}"
      not_found: "%{model} not found"
      cannot_delete_with_associations: "Cannot delete %{model} with %{association}"
    
    models:
      frame:
        not_found: "Frame not found"
        cannot_delete_with_circles: "Cannot delete frame with circles"
      circle:
        not_found: "Circle not found"